# Conda environment for the simulation pipeline.
#
# Create it into a local ./env prefix, which is what run_snakemake.sh expects:
#   mamba env create -f create_py_env/env.yml -p ./env
#   source activate ./env
#
# One environment for the whole workflow, activated before Snakemake starts.
# There are no per-rule `conda:` directives and no containers.
#
# Note: CmdStan itself comes from a cluster module, not from here -- see the
# CMDSTAN guard in run_snakemake.sh.
name: hsgp_r2_sim
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip=24.0
  - r-base
  # --- R packages used by the pipeline ---------------------------------
  - r-cmdstanr      # Stan interface (compile_model.R, fit_model.R)
  - r-posterior     # draws handling and diagnostics (fit_model.R)
  - r-dplyr         # aggregation and plotting
  - r-tidyr         # plot_results.R
  - r-ggplot2       # every figure
  - r-yaml          # config reading (all scripts)
  - pip:
    - snakemake==8.18.0
    - snakemake-executor-plugin-slurm==0.7.0
